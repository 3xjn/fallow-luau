[package]
name = "fallow-luau"
version = "0.1.0"
edition = "2021"
description = "Fallow-shaped codebase intelligence for Luau"
license = "MIT"
publish = false
readme = "README.md"

[[bin]]
name = "fallow-luau"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
full_moon = { version = "2", features = ["luau"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
