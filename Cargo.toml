[package]
name = "fallow-luau"
version = "0.1.1"
edition = "2021"
description = "Fallow-shaped codebase intelligence for Luau"
license = "MIT"
readme = "README.md"
repository = "https://github.com/3xjn/fallow-luau"
homepage = "https://github.com/3xjn/fallow-luau"
documentation = "https://github.com/3xjn/fallow-luau#readme"
keywords = ["luau", "fallow", "complexity", "dead-code", "cli"]
categories = ["command-line-utilities", "development-tools"]
# Publish to crates.io when ready: `cargo publish`
# Until then: `cargo install --git https://github.com/3xjn/fallow-luau`
publish = false

[[bin]]
name = "fallow-luau"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
full_moon = { version = "2", features = ["luau"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
