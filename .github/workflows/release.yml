# Auto-publish GitHub Releases from Cargo.toml version.
# On push to main: if no GitHub Release exists for v$VERSION yet, build + publish.
# Tag pushes and workflow_dispatch also release.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Override tag (e.g. v0.1.1). Empty = Cargo.toml version."
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.meta.outputs.should_release }}
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version / skip if release already published
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          fi
          [[ "$TAG" == v* ]] || TAG="v${TAG}"
          VERSION="${TAG#v}"

          # Skip only when a published GitHub Release already exists (a bare tag is not enough).
          SHOULD=true
          if [[ "${{ github.ref_type }}" != "tag" ]] && gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            SHOULD=false
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG version=$VERSION should_release=$SHOULD"

  build:
    needs: decide
    if: needs.decide.outputs.should_release == 'true'
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
            musl: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        shell: bash
        run: cargo build --release --target "${{ matrix.target }}" --bin fallow-luau

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          OUT=dist
          mkdir -p "$OUT"
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            STAGE="fallow-luau-${VERSION}-${TARGET}"
            mkdir -p "$STAGE"
            cp "target/${TARGET}/release/fallow-luau.exe" "$STAGE/fallow-luau.exe"
            7z a -tzip "${OUT}/fallow-luau-${VERSION}-${TARGET}.zip" "./${STAGE}/fallow-luau.exe"
          else
            STAGE="fallow-luau-${VERSION}-${TARGET}"
            mkdir -p "$STAGE"
            cp "target/${TARGET}/release/fallow-luau" "$STAGE/fallow-luau"
            chmod +x "$STAGE/fallow-luau"
            tar -czf "${OUT}/fallow-luau-${VERSION}-${TARGET}.tar.gz" -C "$STAGE" fallow-luau
          fi
          ls -la "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fallow-luau-${{ matrix.target }}
          path: dist/*

  release:
    needs: [decide, build]
    if: needs.decide.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List assets
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.decide.outputs.tag }}
          name: fallow-luau ${{ needs.decide.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
